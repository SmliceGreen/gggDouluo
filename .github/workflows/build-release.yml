name: Build & Release PDFs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-fonts-extra \
            lmodern \
            latexmk \
            pandoc \
            fonts-noto-cjk

      # ---------- LaTeX 构建 ----------
      - name: Detect LaTeX source
        id: latex
        run: |
          if [ -f main.tex ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "file=main.tex" >> "$GITHUB_OUTPUT"
          else
            f=$(find . -maxdepth 1 -name '*.tex' -print -quit)
            if [ -n "$f" ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "file=${f#./}" >> "$GITHUB_OUTPUT"
            else
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build LaTeX PDF
        if: steps.latex.outputs.build == 'true'
        env:
          TEX_FILE: ${{ steps.latex.outputs.file }}
        run: |
          base="${TEX_FILE%.tex}"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error \
            -jobname="${base}-Latex" "$TEX_FILE"

      # ---------- Markdown 构建 ----------
      - name: Detect Markdown source
        id: md
        run: |
          # 编译小说正文（排除 README.md），README.md 仅在没有其它 md 时兜底
          f=$(find . -maxdepth 1 -name '*.md' ! -name 'README.md' -print | sort | head -n1)
          if [ -z "$f" ] && [ -f README.md ]; then
            f=./README.md
          fi
          if [ -n "$f" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "file=${f#./}" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Markdown PDF
        if: steps.md.outputs.build == 'true'
        env:
          MD_FILE: ${{ steps.md.outputs.file }}
        run: |
          base="${MD_FILE%.md}"
          # 与 _md2tex.py 的 disp_env 保持一致：含 \tag 的 $$ 块必须包进 equation*，
          # 自带 align/gather 等环境的原样输出，否则 \[...\] 里 amsmath 会报 \tag not allowed here
          python3 - "$MD_FILE" <<'PY'
          import re, sys
          p = sys.argv[1]
          src = open(p, encoding='utf-8').read()
          # 1. 含 \tag 的 $$ 块包进 equation*（与 _md2tex.py 的 disp_env 一致）
          def fix(m):
              body = m.group(1)
              if re.search(r'\\begin\{(align|gather|multline|eqnarray|flalign)\*?\}', body):
                  return body
              if '\\tag' in body:
                  # body 自带首尾换行，必须 strip，否则 equation* 里的空行会触发
                  # "! Missing $ inserted."
                  return '\\begin{equation*}\n' + body.strip() + '\n\\end{equation*}'
              return m.group(0)
          src = re.sub(r'\$\$(.+?)\$\$', fix, src, flags=re.S)
          # 2. 每个 ATX 标题（# ...）前必须有空行，否则 pandoc 不把它当标题，
          #    导致目录缺章、标题被当成正文（# 被转义成 \#）
          lines = src.split('\n')
          out = []
          h_re = re.compile(r'^#{1,6}\s')
          for i, l in enumerate(lines):
              if h_re.match(l) and i > 0 and lines[i-1].strip() != '':
                  out.append('')
              out.append(l)
          src = '\n'.join(out)
          open(p, 'w', encoding='utf-8').write(src)
          PY
          # 正文里的 --- 是场景分隔线，会被当成 YAML 元数据块和 simple_tables 的表头分隔行，
          # 后者会让 pandoc 把整段吃成表格、把 \begin{equation*} 转义成普通文本，故一并禁用
          pandoc "$MD_FILE" -o "${base}-md.pdf" \
            -f markdown-yaml_metadata_block-simple_tables-multiline_tables-grid_tables-pipe_tables \
            --pdf-engine=xelatex \
            -V mainfont="Noto Serif CJK SC" \
            -V CJKmainfont="Noto Serif CJK SC" \
            -V geometry:margin=1in \
            -V 'header-includes=\setcounter{MaxMatrixCols}{30}' \
            --toc

      # ---------- 创建 Release 并上传 ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pdf
          generate_release_notes: true
